train_data_path:
  type: text.TextDataset
  filepath: data/01_raw/train.pkl

  # weight_path:
  #   type: text.TextDataset
  #   filepath: data/01_raw/weights.csv

raw_train_data:
  type: pickle.PickleDataset
  filepath: data/02_intermediate/raw_train_data.pkl

processed_train_data:
  type: pickle.PickleDataset
  filepath: data/03_primary/processed_train_data.pkl

processed_train_data_no_nan:
  type: pickle.PickleDataset
  filepath: data/03_primary/processed_train_data_no_nan.pkl

feature_list:
  type: pickle.PickleDataset
  filepath: data/04_feature/feature_list.pkl

model_params:
  type: yaml.YAMLDataset
  filepath: conf/base/parameters/model_params.yml

trained_models:
  type: pickle.PickleDataset
  filepath: data/06_models/trained_models.pkl
  versioned: true
